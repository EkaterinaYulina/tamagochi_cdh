<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Питомец</title>
<style>
@font-face{font-family:Nunito;src:url(assets/fonts/nunito-cyrillic-wght-normal.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;font-display:swap}
@font-face{font-family:Nunito;src:url(assets/fonts/nunito-latin-wght-normal.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
/* ===== токены ===== */
:root{--ink:#3f2b22;--ink2:#8f7463;--paper:#fff7ec;--glass:rgba(255,248,238,.88);--line:rgba(255,255,255,.55);--stitch:rgba(110,70,48,.34);--accent:#e0714f;--sage:#6fae52;--honey:#f2b544;--acts-h:128px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#1c0f09;font-family:Nunito,ui-rounded,"Segoe UI",system-ui,sans-serif;font-weight:700;color:var(--ink);overflow:hidden;touch-action:manipulation}
button{font-family:inherit}
.ic{display:block;flex:none}
.ic [fill]:not([fill="none"]){stroke:none}
#app{max-width:480px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#2a1810;position:relative;overflow:hidden;padding:0 12px}
.hidden{display:none!important}

/* ===== матовое стекло поверх иллюстрации ===== */
.chip,#plaque,.rb,.st,#acts{position:relative;background:var(--glass);backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35);border:1px solid var(--line)}
/* фирменная деталь: пунктирная строчка */
.chip::after,#plaque::after,.rb::after,#acts::after,.btn::after,.row::after,.sp::after{content:"";position:absolute;inset:3px;border-radius:inherit;border:1.5px dashed var(--stitch);pointer-events:none}
#top,#stats,#acts{z-index:3}
#top,#stats{position:relative}

/* ---------- верхняя панель ---------- */
#top{display:flex;gap:8px;padding:12px 0 8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 16px 0 8px;border-radius:999px;font-weight:800;font-size:18px}
#coins .ic{width:28px;height:28px}
#plaque{flex:1;min-width:0;height:52px;border-radius:20px;padding:8px 14px;display:flex;flex-direction:column;justify-content:space-between}
.pl1{display:flex;align-items:baseline;gap:8px;min-width:0}
.pl1 b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.pl1 small{font-size:12px;color:var(--ink2);white-space:nowrap;margin-left:auto;font-weight:700}
.xp{height:8px;border-radius:6px;background:rgba(90,55,35,.16);overflow:hidden}
.xp i{display:block;height:100%;border-radius:6px;background:var(--honey);transition:width .6s}
.rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.rb:active{transform:scale(.92)}
.rb .ic{width:22px;height:22px}
.rb .ic [fill]:not([fill="none"]){fill:var(--ink)}
.rb .ic [fill="none"][stroke]{stroke:var(--ink)}

/* ---------- показатели ---------- */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 0 12px}
.st{height:36px;border-radius:999px;display:flex;align-items:center;padding:0 10px 0 4px}
.bd{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--t1)}
.bd .ic{width:18px;height:18px}
.bar{flex:1;height:10px;margin-left:7px;border-radius:6px;background:rgba(90,55,35,.16);overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:6px;position:relative;transition:width .5s,background .5s}
.bar i::after{content:"";position:absolute;left:5px;right:5px;top:calc(50% - 1px);border-top:2px dashed #ffffffaa}
.st.low{animation:wob 1s ease-in-out infinite}
.st.low .bd{animation:pulse .8s ease-in-out infinite alternate}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes pulse{to{transform:scale(1.12)}}

/* ---------- плоские пастельные плитки ---------- */
.t-peach{--t1:#fbd2b0}.t-mint{--t1:#cfe4b5}.t-sky{--t1:#c4dbf0}.t-lav{--t1:#dccdee}
.t-butter,.t-yellow{--t1:#ffe29c}.t-pink{--t1:#f6c6cb}.t-purple{--t1:#dccdee}
.tile{display:grid;place-items:center;border-radius:22px;background:var(--t1)}

/* ---------- сцена на весь экран ---------- */
#scene{position:absolute;inset:0;margin:0;overflow:hidden;container-type:size;z-index:0}
#petWrap{position:absolute;left:50%;bottom:calc(var(--acts-h) + 22px);width:min(92%,400px,56cqh);transform:translateX(-50%);cursor:pointer;z-index:3;isolation:isolate}
.bub{position:absolute;right:2%;top:2%;width:54px;height:54px;border-radius:50%;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);display:grid;place-items:center;animation:bubf 1.8s ease-in-out infinite;z-index:2}
/* ---------- комната ---------- */
#room{position:absolute;inset:0}
.wall{position:absolute;inset:0 0 34% 0;background:linear-gradient(#ffe6cc,#ffd1ae)}
.wall::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 26px,#ffffff30 26px 52px)}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#0000,#ff9a6a2e)}
.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#d9a066,#b57a42)}
.floor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 62px,#6a3a1a22 62px 64px),repeating-linear-gradient(#0000 0 46px,#6a3a1a14 46px 48px)}
.floor::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,#fff3c455,#0000 65%)}
.base{position:absolute;left:0;right:0;bottom:34%;height:13px;background:linear-gradient(#fff6ea,#f0d5b6);box-shadow:0 3px 5px #0003}
.rug{position:absolute;left:50%;bottom:5%;width:80%;height:19%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#ff9d8d 0 30%,#ffd6cb 30% 40%,#ff9d8d 40% 62%,#ffc2b5 62% 100%);box-shadow:0 7px 0 #c9604f66,0 14px 16px #0003}
.win{position:absolute;left:8%;top:7%;width:33%;aspect-ratio:1/1.08;border-radius:20px 20px 8px 8px;background:#fff;box-shadow:0 6px 0 #ebd1b4,0 12px 16px #8a5a3a33}
.sky{position:absolute;inset:7px;border-radius:14px 14px 5px 5px;background:linear-gradient(#85d0ff,#dff4ff);overflow:hidden;transition:background 1s}
.sky::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity 1s;background:radial-gradient(1.6px 1.6px at 20% 18%,#fff,#0000),radial-gradient(1.4px 1.4px at 74% 12%,#fff,#0000),radial-gradient(1.8px 1.8px at 60% 48%,#fff,#0000),radial-gradient(1.4px 1.4px at 14% 60%,#fff,#0000),radial-gradient(1.6px 1.6px at 86% 70%,#fff,#0000)}
.win::before,.win::after{content:"";position:absolute;background:#fff;z-index:2}
.win::before{left:calc(50% - 3px);top:7px;bottom:7px;width:6px}
.win::after{top:calc(50% - 3px);left:7px;right:7px;height:6px}
#sunmoon{position:absolute;left:50%;top:14%;width:50%;transform:translateX(-50%);transition:transform 1s}
#sunmoon .ic{width:100%;height:auto;filter:drop-shadow(0 0 8px #ffe27a)}
.cl{position:absolute;height:14px;border-radius:10px;background:#fff;opacity:.9;animation:drift 22s linear infinite}
.cl::before{content:"";position:absolute;left:18%;top:-8px;width:44%;height:16px;border-radius:50%;background:#fff}
.c1{width:42%;top:62%;left:-40%}.c2{width:32%;top:36%;left:-40%;animation-delay:-11s;animation-duration:28s}
@keyframes drift{to{transform:translateX(420%)}}
#scene.night .sky{background:linear-gradient(#1a2255,#3d4390)}
#scene.night .sky::after{opacity:1}
#scene.night .cl{opacity:.25}
.cur{position:absolute;top:-4px;bottom:-12px;width:24%;z-index:3;background:repeating-linear-gradient(90deg,#ffb3c2 0 6px,#ff9db0 6px 12px);border-radius:0 0 14px 14px;box-shadow:0 4px 8px #0002}
.cur.l{left:-17%;transform-origin:top;transform:skewX(-2deg)}.cur.r{right:-17%;transform:skewX(2deg)}
.shaft{position:absolute;left:10%;top:30%;width:42%;height:58%;background:linear-gradient(#fff6b870,#fff6b800);clip-path:polygon(0 0,62% 0,100% 100%,38% 100%);filter:blur(3px);transition:opacity 1s;animation:shaft 6s ease-in-out infinite alternate}
@keyframes shaft{to{opacity:.65}}
#scene.night .shaft{opacity:0;animation:none}
.frame{position:absolute;right:9%;top:22%;width:16%;aspect-ratio:1/1.2;border-radius:12px;background:linear-gradient(#ffb7cf,#ff8fb2);box-shadow:0 4px 0 #e0658f,0 8px 10px #8a5a3a33;display:grid;place-items:center;transform:rotate(3deg)}
.frame::before{content:"";position:absolute;inset:6px;border-radius:8px;background:linear-gradient(#ffd0df,#ffb0c8);box-shadow:inset 0 2px 4px #0002}
.frame .ic{position:relative;width:62%;height:auto;filter:drop-shadow(0 2px 0 #e0658f)}
.lamp{position:absolute;right:20%;top:0;width:38px;height:calc(9% + 24px)}
.lamp::before{content:"";position:absolute;left:calc(50% - 1px);top:0;width:2px;bottom:20px;background:#b98a5e}
.lamp i{position:absolute;left:0;right:0;bottom:0;height:24px;border-radius:20px 20px 5px 5px;background:linear-gradient(#ffc27a,#ff9456);box-shadow:inset 0 3px 0 #ffffff88,0 4px 0 #d9702f}
.plant{position:absolute;right:3%;bottom:20%;width:17%;filter:drop-shadow(0 6px 6px #0003);transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(2.5deg)}}
.shade{position:absolute;inset:0;background:#1d2060;mix-blend-mode:multiply;opacity:0;transition:opacity 1s;pointer-events:none;z-index:5}
#scene.night .shade{opacity:.46}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 74% 14%,#ffd27acc,#ffd27a00 46%);mix-blend-mode:screen;opacity:0;transition:opacity 1s;pointer-events:none;z-index:6}
#scene.night .glow{opacity:1}
#scene.hasbg #room{display:none}
.bgl{position:absolute;inset:0;background-size:cover;background-position:50% 100%;opacity:0;transition:opacity 1.6s ease}
#scene.hasbg #bgd{opacity:1}
#scene.hasnight.night #bgn{opacity:1}
#scene.hasnight .shade,#scene.hasnight .glow{display:none}
#petWrap{transition:filter 1.6s}
#scene.night.hasnight #petWrap{filter:brightness(.8) saturate(.92) contrast(1.03)}
.flashfx{position:absolute;inset:0;background:radial-gradient(circle,#fff,#fff0 72%);opacity:0;pointer-events:none;z-index:8}
#scene.flash .flashfx{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}

/* ---------- питомец ---------- */
#petWrap::before{content:"";position:absolute;left:12%;right:12%;bottom:-2%;height:10%;border-radius:50%;background:radial-gradient(#3a1d0f8c,#3a1d0f00 70%);filter:blur(4px);z-index:-1}
#petWrap svg{width:100%;display:block;overflow:visible}
.bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.slow{animation-duration:4s}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025) translateY(-3px)}}
.wag{animation:wag .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.z{animation:zz 2.4s infinite;opacity:0}
.z2{animation-delay:.8s}
.spr{position:relative;width:100%;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center}
.spr img{height:var(--h);max-width:100%;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;-webkit-user-drag:none;pointer-events:none}
.spr.dirty img{filter:sepia(.45) brightness(.92)}
.spr .zzz{position:absolute;right:12%;bottom:calc(var(--h) + 1%);animation:zz 2.4s infinite;opacity:0}
.spr .zzz .ic{width:46px;height:46px}
.chew{animation:chew .35s ease-in-out infinite alternate}
@keyframes chew{from{transform:scale(1,1)}to{transform:scale(1.03,.97)}}
#petWrap.squish>.spr,#petWrap.squish>svg{animation:squish .3s;transform-origin:50% 100%}
@keyframes squish{0%{transform:scale(1)}40%{transform:scale(1.07,.92)}100%{transform:scale(1)}}
@keyframes zz{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.bub .ic{width:34px;height:34px}
@keyframes bubf{50%{transform:translateY(-6px) rotate(3deg)}}
.fl{position:absolute;bottom:42%;animation:up 1.3s ease-out forwards;pointer-events:none;z-index:7;margin-left:-20px}
.fl .ic{width:40px;height:40px;filter:drop-shadow(0 3px 3px #0004)}
@keyframes up{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-12px) scale(1.1)}100%{transform:translateY(-120px) scale(1);opacity:0}}



/* ---------- нижняя панель ---------- */
#acts{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:12px 6px 10px;margin:auto 0 14px;border-radius:30px}
#acts::after{inset:5px;border-radius:26px}
#acts button{position:relative;z-index:1;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);cursor:pointer}
#acts .tile{width:100%;max-width:62px;aspect-ratio:1;transition:transform .12s}
#acts .tile .ic{width:58%;height:58%}
#acts button:active .tile{transform:scale(.92)}
#acts .lb{font-size:12px;font-weight:800}
#acts .pr{position:absolute;right:calc(50% - 38px);top:-8px;display:flex;align-items:center;gap:1px;background:#fff;border-radius:999px;padding:1px 7px 1px 3px;font-size:12px;font-style:normal;font-weight:800}
#acts .pr .ic{width:16px;height:16px}
#acts .pr.no{color:#c4412f}
#acts button.off{opacity:.45}
#acts button.bump .tile{animation:bump .4s}
@keyframes bump{40%{transform:translateY(-6px) scale(1.06)}}

/* ---------- подсказка ---------- */
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%) translateY(-14px) scale(.9);background:rgba(40,24,16,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,1.4,.4,1);z-index:20;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}

/* ---------- окна ---------- */
#ov{position:absolute;inset:0;background:rgba(30,16,10,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{position:relative;background:var(--paper);border-radius:32px;padding:22px 18px 18px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto;animation:pop .32s cubic-bezier(.2,1.2,.4,1)}
.card::after{content:"";position:absolute;inset:7px;border-radius:26px;border:1.5px dashed var(--stitch);pointer-events:none}
@keyframes pop{from{transform:scale(.92) translateY(16px);opacity:0}}
.card h2{margin:2px auto 4px;padding:0 36px;font-size:22px;font-weight:900;text-align:center;color:var(--ink)}
.x{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(90,55,35,.09);cursor:pointer}
.x:active{transform:scale(.9)}
.x .ic{width:16px;height:16px}
.x .ic [fill="none"][stroke]{stroke:var(--ink)}
.card .chip{background:#fff;border:1px solid rgba(110,70,48,.12);backdrop-filter:none;-webkit-backdrop-filter:none}
.card .chip::after{display:none}
.cc{align-self:center;margin-bottom:2px}
.cc .ic{width:24px;height:24px}
.row{position:relative;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid rgba(110,70,48,.1);border-radius:22px;padding:10px;color:var(--ink);cursor:pointer;text-align:left;transition:transform .12s}
.row::after{display:none}
.row:active{transform:scale(.97)}
.row .tile{width:52px;height:52px;flex:none;border-radius:18px}
.row .tile .ic{width:60%;height:60%}
.row .nm{flex:1;font-size:17px;font-weight:700;line-height:1.15}
.pp{display:flex;align-items:center;gap:5px;padding:7px 12px 7px 8px;border-radius:999px;font-weight:800;font-size:16px;background:#ffe6a8;color:#6b4310}
.pp .ic{width:20px;height:20px}
.pp.no{background:#efe5d8;color:#a89887}
.pp.no .ic{opacity:.5}
.pp.g{background:#d3eac0;color:#3d6b28}
.row.armed{background:#fde3da;border-color:#f3b9a6}
.row.armed .nm{color:#b84538}
.btn{position:relative;border:0;border-radius:999px;padding:15px;font-size:18px;font-weight:800;color:#fff;background:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.btn::after{inset:4px;border-color:#ffffff88}
.btn:active{transform:scale(.97)}
.btn.alt{background:rgba(90,55,35,.09);color:var(--ink)}
.btn.alt::after{border-color:var(--stitch)}
.btn.go{background:var(--sage)}
.btn .ic{width:26px;height:26px}

/* выбор питомца */
.species{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sp{position:relative;background:#fff;border:2px solid transparent;border-radius:24px;padding:6px 2px 10px;display:flex;flex-direction:column;align-items:center;color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;transition:transform .15s}
.sp::after{display:none}
.sp.on{border-color:var(--accent);background:#fff1e6;transform:translateY(-2px)}
.sp svg{width:100%;display:block}
.sp .spr{margin-bottom:2px}
.coats{display:flex;gap:16px;justify-content:center;padding:4px 0}
.coat{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(90,55,35,.22);cursor:pointer;padding:0;transition:transform .12s}
.coat.on{box-shadow:0 0 0 3px var(--accent);transform:scale(1.1)}
#pname{border:1px solid rgba(110,70,48,.14);border-radius:20px;padding:13px;font-size:18px;font-family:inherit;font-weight:800;text-align:center;color:var(--ink);background:#fff;user-select:text;-webkit-user-select:text;width:100%;outline:none}
#pname:focus{border-color:var(--accent)}
/* мини-игра */
.git{position:absolute;top:0;left:0;will-change:transform}
.git .ic{width:40px;height:40px;filter:drop-shadow(0 3px 4px #0007)}
.git.s .ic{filter:drop-shadow(0 0 9px #ffcf6b)}
#gp{position:absolute;bottom:0;width:96px;margin-left:-48px}
#gp svg{width:100%;display:block}
#ghint{position:absolute;top:38%;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:17px;padding:0 24px;transition:opacity .6s;text-shadow:0 2px 6px #0006;line-height:1.35}
.bigstar{position:relative;display:grid;place-items:center;height:130px}
.bigstar::before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(#ffcf6b99,#ffcf6b00 68%);animation:spin 6s linear infinite}
.bigstar .ic{width:110px;height:110px;filter:drop-shadow(0 6px 6px #d98a0066);animation:starpop .6s cubic-bezier(.2,1.6,.4,1)}
.bigstar b{position:absolute;font-size:38px;font-weight:900;color:#fff;text-shadow:0 3px 0 #d98a00,0 0 12px #d98a00;top:50%;transform:translateY(-44%)}
@keyframes starpop{from{transform:scale(.2) rotate(-40deg);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}


.game{height:90%}
.ghud{display:flex;align-items:center;gap:10px;padding-right:46px;min-height:44px}
.ghud .chip .ic{width:26px;height:26px}
.gt{flex:1;position:relative;height:28px;border-radius:999px;background:rgba(90,55,35,.14);overflow:hidden}
.gt i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--sage);border-radius:999px;transition:width .25s linear,background .3s}
.gt i.low{background:#e8705c}
.gt b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff}
#garea{flex:1;position:relative;border-radius:24px;overflow:hidden;touch-action:none;background:linear-gradient(#1a102244,#1a102288),url(assets/bg_room_night.webp) 50% 100%/cover,#1a2255}
.rw{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;color:var(--ink2)}

/* ---------- декор комнаты, темы, частицы ---------- */
#decor{position:absolute;inset:0;z-index:2;pointer-events:none}
.dsl{transition:filter 1.6s}
#scene.night.hasnight .dsl{filter:brightness(.8) saturate(.92) contrast(1.03)}
#scene.night .dsl.lit{filter:drop-shadow(0 0 16px #ffd45a) brightness(1.08)}
.dsl{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.dsl svg,.dsl img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;animation:dpop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes dpop{from{transform:scale(.6);opacity:0}}
.dsl.s-wall_l,.dsl.s-wall_r{top:15.5%;width:25%;height:17%;align-items:center}
.dsl.s-wall_l{left:2%}.dsl.s-wall_r{right:2%}
.dsl.s-floor_l,.dsl.s-floor_r{bottom:calc(var(--acts-h) + 64px);width:23%;height:21%}
.dsl.s-floor_l{left:1%}.dsl.s-floor_r{right:1%}
.dsl.s-rug{left:6%;width:88%;height:16%;bottom:calc(var(--acts-h) + 8px)}
#fx{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.p{position:absolute;top:-24px;width:var(--s);height:var(--s);opacity:0;animation:fall linear infinite}
.p.winter{border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}
.p.spring{border-radius:70% 0 70% 0;background:#ffc2d1;animation-name:fall2}
.p.space{border-radius:50%;background:#fff;box-shadow:0 0 8px #cfe0ff;animation:twinkle ease-in-out infinite}
@keyframes fall{0%{transform:translate(0,0);opacity:0}8%{opacity:.9}100%{transform:translate(34px,calc(100cqh + 30px));opacity:.9}}
@keyframes fall2{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.95}100%{transform:translate(-70px,calc(100cqh + 30px)) rotate(420deg);opacity:.95}}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
.bgl{transition:opacity 1.6s ease,filter .8s}
#scene.th-winter:not(.th-img) .bgl{filter:hue-rotate(170deg) saturate(.55) brightness(1.08)}
#scene.th-spring:not(.th-img) .bgl{filter:hue-rotate(-24deg) saturate(1.1) brightness(1.04)}
#scene.th-space:not(.th-img) .bgl{filter:hue-rotate(205deg) saturate(.9) brightness(.8)}

/* ---------- магазин: вкладки, строки, желание ---------- */
.card.shop{overflow:hidden;height:min(100%,690px);padding-bottom:14px}
.shbody{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;flex:1;padding:4px 2px 8px;margin:0 -2px}
.tabs{display:flex;gap:4px;background:rgba(90,55,35,.08);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;border-radius:999px;padding:9px 2px;font-weight:800;font-size:14px;background:none;color:var(--ink2);cursor:pointer;font-family:inherit}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px #5a37231f}
.row small{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-top:3px;line-height:1.2}
.row .tile{overflow:hidden}
.row .tile svg:not(.ic),.row .tile img{width:80%;height:80%;object-fit:contain}
.row .tile .spr{width:100%}
.row .tile .sw{display:block;width:56%;aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(90,55,35,.22)}
.row.lock{opacity:.62}
.row.static{cursor:default}
.row.wish{border-color:var(--accent);animation:wishp 1.2s ease-in-out infinite alternate}
@keyframes wishp{from{box-shadow:0 0 0 2px #e0714f33}to{box-shadow:0 0 0 6px #e0714f1f}}
.row.sale::before{content:attr(data-pct);position:absolute;left:10px;top:-7px;z-index:1;background:var(--accent);color:#fff;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px}
.pp s{opacity:.55;font-size:12px;margin-right:2px;font-weight:700}
.sh{font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:8px 4px 0}
.rprog{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:18px;padding:10px 14px;border:1px solid rgba(110,70,48,.1)}
.rprog b{font-size:15px}.rprog small{font-size:12px;color:var(--ink2);font-weight:700}
.empty{text-align:center;color:var(--ink2);padding:14px;font-weight:700}
.coats.in{padding:2px 0 6px}
.x2{font-style:normal;margin-left:3px;background:var(--sage);color:#fff;border-radius:999px;padding:1px 7px;font-size:13px;font-weight:900}
.bub.wish{background:#fff;border:2px dashed var(--accent);cursor:pointer}
.bub svg:not(.ic),.bub img{width:38px;height:38px;object-fit:contain}
.bub .hb{position:absolute;right:-5px;top:-5px}
.bub .hb .ic{width:22px;height:22px}

/* характер, навыки, прогулки */
#plaque{cursor:pointer}
#dhit{position:absolute;inset:0;z-index:4;pointer-events:none}
#dhit .dsl{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
#petWrap{translate:var(--dx,0%) 0;transition:filter 1.6s,translate .55s cubic-bezier(.3,1.2,.5,1)}
#petWrap.jump>.spr,#petWrap.jump>svg{animation:pjump .7s ease-out;transform-origin:50% 100%}
#petWrap.shake>.spr,#petWrap.shake>svg{animation:pshake .6s;transform-origin:50% 100%}
@keyframes pjump{0%,100%{transform:translateY(0)}25%{transform:translateY(-9%) scale(.97,1.04)}50%{transform:translateY(0) scale(1.05,.94)}75%{transform:translateY(-5%)}}
@keyframes pshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
#petWrap .away{display:flex;flex-direction:column;align-items:center;gap:2px;width:max-content;max-width:90%;margin:0 auto 22cqh;padding:14px 22px;border-radius:26px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--ink);cursor:default}
#petWrap .away .ic{width:38px;height:38px;filter:drop-shadow(0 2px 2px #7a4a2a55)}
#petWrap .away b{font-size:17px;font-weight:900}
#petWrap .away span{font-size:15px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.tabs button{position:relative}
.tabs .dot{position:absolute;top:5px;right:calc(50% - 26px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
.row .q{font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 0 #00000026}
.row .nm .xp{margin:5px 0 1px}
.hint{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:2px 6px 0;line-height:1.25}
.rw.care{font-size:14px}
</style>
</head>

async function initSDK(){
  try{
    if(!window.YaGames)throw 0;
    ysdk=await YaGames.init();
    const l=(ysdk.environment.i18n.lang||'ru').toLowerCase();
    lang=['ru','be','kk','uk','uz'].includes(l)?'ru':'en';
    try{player=await ysdk.getPlayer({scopes:false})}catch(e){}
    try{ysdk.on('game_api_pause',()=>{adOpen=true});ysdk.on('game_api_resume',()=>{adOpen=false})}catch(e){}
  }catch(e){ysdk=null}
}
async function load(){
  let a=null,b=null;
  try{a=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  try{if(player){const d=await player.getData(['state']);b=d&&d.state}}catch(e){}
  const best=[a,b].filter(Boolean).sort((x,y)=>(y.last||0)-(x.last||0))[0];
  if(best)S=Object.assign(def(),best);
}
function save(force){

let ac=null;
function beep(f=440,d=.12,type='sine',v=.08,at=0){
  if(S.muted||adOpen||document.hidden)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    const t0=ac.currentTime+at;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d)}catch(e){}
}

function checkEvolve(){
  if(!S.species)return;
  const ns=S.xp>=120?3:S.xp>=40?2:1;
  if(ns>S.stage){S.stage=ns;toast(t('evolved'));sfx.up();burst();flash();lastSig=''}
}
/* время отсутствия: первые 2 минуты идут как обычно, дальше потребности убывают в 2.5 раза медленнее (плавно, без скачка) */
const awayTime=m=>Math.min(m,2)+Math.max(0,m-2)*.4;
function step(m){
  if(!S.species)return;
  const fh=fxm('hunger'),fe=fxm('energy'),fm=fxm('mood')*(1-sk('bea')*.02),fc=fxm('clean');
  if(S.sleeping){
    S.energy+=4*m*fxm('sleep');S.hunger-=.8*m*fh;S.mood-=.2*m*fm;S.clean-=.4*m*fc;
    if(S.energy>=100){S.sleeping=false;toast(t('wokeUp'))}
  }else{
    S.hunger-=1.5*m*fh;S.energy-=1*m*fe;S.mood-=1.2*m*fm;S.clean-=1*m*fc;
    if(S.hunger<20||S.clean<20)S.mood-=.8*m*fm;
  }
  for(const k of ST)S[k]=cl(S[k]);
  if((S.hunger+S.energy+S.mood+S.clean)/4>=55)S.xp+=m*fxm('xp')*(1+sk('int')*.02);
  checkEvolve();
}
let saveTick=0;
function loop(){
  const n=Date.now();let m=(n-S.last)/60000;if(m<0)m=0;m=Math.min(m,480);
  /* пока питомец гуляет, потребности стоят; время после конца прогулки (игрока не было) считается как обычное отсутствие */
  if(S.walk)m=Math.max(0,Math.min(m,(n-S.walk.until)/60000));
  ensureTaste();step(awayTime(m));S.last=n;wishTick();walkTick();render();
  if(++saveTick%10===0)save();
}
function pay(n){if(S.coins<n){toast(t('noCoins'));sfx.bad();return false}S.coins-=n;return true}

function act(name){
  if(adOpen||!S.species)return;
  if(name==='walk'){openProfile();return}
  if(S.walk&&name!=='shop'){toast(L('Гуляет, скоро вернётся','Out for a walk, back soon'));return}
  if(name==='sleep'){
    if(S.sleeping){S.sleeping=false;toast(t('wokeUp'))}
    else if(S.energy>=95){toast(t('noSleep'));return}
    else{S.sleeping=true;fl('zzz')}
  }else if(S.sleeping){toast(t('sleepingNow'));return}
  else if(name==='feed'){
    if(S.hunger>=95){toast(t('full'));return}
    if(!pay(3))return;
    S.hunger=cl(S.hunger+25);S.xp+=.5;eating=Date.now()+1400;fl(food());sfx.ok();
  }else if(name==='wash'){
    if(S.clean>=95){toast(t('clean'));return}
    S.clean=cl(S.clean+40);S.mood=cl(S.mood+3);fl('bubbles');sfx.tap();
  }else if(name==='play'){
    if(S.energy<15){toast(t('tooTired'));return}
    openGame();return;
  }else if(name==='shop'){openShop();return}
  render(true);save();
}
function petTap(){
  if(adOpen||!S.species||S.sleeping||S.walk)return;
  S.mood=cl(S.mood+1.5);fl('heart');sfx.tap();render();
  const w=$('#petWrap');w.classList.remove('squish');void w.offsetWidth;w.classList.add('squish');setTimeout(()=>w.classList.remove('squish'),320);
}

let picking=false,adding=false;
const SPR={},SPRD={},STATES=['happy','sad','sleep','eat'],SH=[0,.66,.84,1];
/* у вида есть готовые картинки; тогда дополнительные окрасы продаются в магазине, иначе все три окраса бесплатны (рисуются кодом) */
const spriteArt=sp=>sprState(sprKey(sp,0,1,'happy'))==='ok';
const coatFree=(sp,ci)=>ci===0||!spriteArt(sp)||!!S.owned['coat_'+sp+'_'+ci];
const sprKey=(sp,ci,st,f)=>`${sp}_${ci}_${st}_${f}`;
function sprState(k){
  if(SPR[k])return SPR[k];
  SPR[k]='loading';
  const im=new Image();
  im.onload=()=>{SPR[k]='ok';SPRD[k]=[im.naturalWidth,im.naturalHeight];lastSig='';if(picking)drawPick()};
  im.onerror=()=>{SPR[k]='no'};
  im.src='assets/'+k+'.webp';
  return'loading';
}
function preloadSprites(){
  if(S.species)for(let st=1;st<=3;st++)for(const f of STATES)sprState(sprKey(S.species,S.coat,st,f));
  for(const sp in SP){sprState(sprKey(sp,0,1,'happy'));for(const ci of [1,2])for(const st of [1,3])sprState(sprKey(sp,ci,st,'happy'))}
  if(S.species&&S.skin)for(let st=1;st<=3;st++)for(const f of STATES)sprState(sprKey(S.species,S.coat,st,f)+'_'+S.skin);
  if(S.species)for(const x of SK)sprState(sprKey(S.species,S.coat,3,'happy')+'_'+x.skin);
  for(const d of DEC)sprState('decor_'+d.id);

function drawAny(sp,ci,st,f,o={}){
  let k=sprKey(sp,ci,st,f),s=sprState(k);
  if(s==='no'&&f!=='happy'){k=sprKey(sp,ci,st,'happy');s=sprState(k)}
  if(s!=='ok')return drawPet(sp,ci,st,f,o);
  const cls=f==='eat'&&k.endsWith('_happy')?'chew':f==='sleep'?'bob slow':'bob';
  /* образ (шапка, очки…): отдельный файл <ключ>_<образ>.webp; если для этой позы его нет, показываем обычный */
  let src=k;if(o.skin&&sprState(k+'_'+o.skin)==='ok')src=k+'_'+o.skin;
  /* лежащий зверь шире и ниже сидящего: выравниваем по площади, чтобы «вес» картинки не прыгал */
  const dh=SPRD[sprKey(sp,ci,st,'happy')],dk=SPRD[k];
  const fac=dh&&dk&&!k.endsWith('_happy')?Math.max(.5,Math.min(1.2,Math.sqrt((dh[0]/dh[1])*(dk[1]/dk[0])))):1;
  const H=(SH[st]*fac*100).toFixed(1);
  return`<div class="spr ${o.dirty?'dirty':''}" style="--h:${H}%"><img class="${cls}" src="assets/${src}.webp" alt="" draggable="false">${f==='sleep'?`<span class="zzz">${ic('zzz')}</span>`:''}</div>`;
}

  sc.classList.toggle('th-img',img);

  const bd=$('#bgd'),bn=$('#bgn');
  if(bd._b!==d){bd._b=d;bd.style.backgroundImage=`url(assets/${d}.webp)`}
  if(bn._b!==n){bn._b=n;bn.style.backgroundImage=`url(assets/${n}.webp)`}
  setHTML($('#fx'),fxHTML(th));
}
function rnd(seed){let s=0;for(const c of String(seed))s=(s*31+c.charCodeAt(0))>>>0;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}

/* ---------- витрина дня ---------- */
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const isLocked=it=>it.k==='decor'&&S.stage<it.st;
function avail(it){
  if(it.k==='skin')return!!S.species&&sprState(sprKey(S.species,S.coat,3,'happy')+'_'+it.skin)==='ok';
  if(it.k==='coat')return sprState(sprKey(it.sp,it.ci,3,'happy'))==='ok'&&sprState(sprKey(it.sp,it.ci,1,'happy'))==='ok'&&spriteArt(it.sp);
  return true;
}
function showcase(){
  const k=dayKey();
  if(!S.shop||S.shop.d!==k)S.shop={d:k,ids:[],disc:'',free:0};
  const sh=S.shop;
  if(!sh.ids.length){
    const pool=[...DEC,...TH,...SK,...(S.species?coatItems(S.species):[])].filter(x=>!S.owned[x.id]&&avail(x));
    const r=rnd(k),pick=[];
    while(pick.length<3&&pool.length)pick.push(pool.splice(Math.floor(r()*pool.length),1)[0].id);
    sh.ids=pick;sh.disc=pick.length?pick[Math.floor(r()*pick.length)]:'';
  }
  return sh;
}

/* ---------- получение и использование предметов ---------- */
function grant(it){
  S.owned[it.id]=1;
  if(it.k==='decor'){if(!S.placed[it.slot])S.placed[it.slot]=it.id}
  else if(it.k==='theme')S.theme=it.theme;
  else if(it.k==='skin')S.skin=it.skin;
  else if(it.k==='coat'&&S.species===it.sp){S.coat=it.ci;preloadSprites()}
  if(S.wish&&S.wish.id===it.id){
    S.mood=cl(S.mood+30);S.wish=null;S.wishAt=Date.now()+20*60000;
    toast(L('Питомец в восторге!','Your pet is thrilled!'));fl('heart');setTimeout(()=>fl('heart'),180);
  }
  roomBonus();
  lastSig='';
}
function roomBonus(){
  const n=DEC.filter(d=>S.owned[d.id]).length,M=[[4,25],[8,50],[DEC.length,100]];
  while(S.roomRw<M.length&&n>=M[S.roomRw][0]){
    const bonus=M[S.roomRw][1];
    S.coins+=bonus;
    setTimeout(()=>{toast(L('Бонус за комнату','Room bonus')+' +'+bonus);fl('coin')},900);
    S.roomRw++;
  }
}
function useOwned(it){
  if(it.k==='decor'){if(S.placed[it.slot]===it.id)delete S.placed[it.slot];else{S.placed[it.slot]=it.id;sfx.tap()}}
  else if(it.k==='theme')S.theme=S.theme===it.theme?'':it.theme;
  else if(it.k==='skin')S.skin=S.skin===it.skin?'':it.skin;
  else if(it.k==='coat'&&S.species===it.sp){S.coat=it.ci;preloadSprites()}
  shopAgain();
}
function shopAgain(){lastSig='';render(true);save();openShop(null,null,true)}
function buyItem(it,p){
  if(!pay(p))return;
  const had=S.placed[it.slot];
  grant(it);fl(it.ic||'sparkle');sfx.ok();
  if(it.k==='decor'&&S.placed[it.slot]===it.id&&!had)toast(L('Поставлено в комнату','Placed in the room'));
  lastSig='';render(true);save(true);openShop(null,null,true);
}
function wishTick(){
  const n=Date.now();
  if(S.wish){if(n>S.wish.until||S.owned[S.wish.id]){S.wish=null;S.wishAt=n+15*60000}return}
  if(!S.species||S.sleeping||S.walk||n<S.wishAt)return;
  const pool=DEC.filter(d=>!S.owned[d.id]&&S.stage>=d.st);
  if(pool.length)S.wish={id:pool[Math.floor(Math.random()*pool.length)].id,until:n+60*60000};
}

/* ---------- характер, навыки, прогулки, скидки дня ---------- */
let pose={f:'',u:0};
function setPose(f,ms){pose={f,u:Date.now()+ms};lastSig='';render()}
function anim(c){const w=$('#petWrap');w.classList.remove('jump','shake');void w.offsetWidth;w.classList.add(c);setTimeout(()=>w.classList.remove(c),800)}
const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const fmtMin=m=>m<60?m+' '+L('мин','min'):Math.floor(m/60)+' '+L('ч','h')+(m%60?' '+m%60+' '+L('мин','min'):'');

/* навыки: 0..100, уровень = десятки; влияют на монеты, опыт, настроение, находки */
const SKL=[
 {id:'agi',ic:'bolt',t:'t-yellow',n:['Ловкость','Agility'],d:['+3% монет за уровень, шире ловит звёзды','+3% coins per level, catches stars wider']},
 {id:'int',ic:'star',t:'t-sky',n:['Интеллект','Intellect'],d:['+2% опыта за уровень, чаще находки','+2% XP per level, more finds on walks']},
 {id:'bea',ic:'sparkle',t:'t-pink',n:['Обаяние','Charm'],d:['Настроение падает на 2% медленнее за уровень','Mood drops 2% slower per level']}
];
const sk=id=>Math.floor(((S.skl&&S.skl[id])||0)/10);
function gain(id,v){
  if(!S.skl)S.skl={agi:0,int:0,bea:0};
  const o=sk(id);S.skl[id]=Math.min(100,(S.skl[id]||0)+v);
  if(sk(id)>o){toast(L(...SKL.find(x=>x.id===id).n)+' '+sk(id)+'!');fl('sparkle')}
}
const care=()=>{const a=(S.hunger+S.mood)/2;return a>=75?1.3:a>=45?1:.75};

/* вкусы: любимое и нелюбимое из лавки, открываются на опыте */
const TASTE_POOL=['treat','cake','feast','toy','spa'];
function ensureTaste(){
  if(S.taste||!S.species)return;
  const r=[...TASTE_POOL],pick=()=>r.splice(Math.floor(Math.random()*r.length),1)[0];
  S.taste={l:pick(),h:pick(),kl:0,kh:0};
}
function tasteReact(id){
  ensureTaste();const T=S.taste;
  if(id===T.l){
    T.kl=1;S.mood=cl(S.mood+15);S.xp+=1;checkEvolve();anim('jump');
    toast(L('Обожает это!','Loves it!'));[0,150,300].forEach(d=>setTimeout(()=>fl('heart'),d));
  }else if(id===T.h){
    T.kh=1;S.mood=cl(S.mood-12);anim('shake');setPose('sad',1800);
    toast(L('Фу, не любит это','Yuck, hates this'));
  }
}

/* скидки по дням недели: ср — спа, пт — игрушки, сб/вс — пекарня */
let dayOver=null;
const dow=()=>dayOver!==null?dayOver:new Date().getDay();
const BAKE={ids:['cake','treat','feast'],pct:.3,n:['Пекарня выходного дня','Weekend bakery']};
const EVT={3:{ids:['spa'],pct:.3,n:['Спа-среда','Spa Wednesday']},5:{ids:['toy'],pct:.4,n:['Пятница игрушек','Toy Friday']},6:BAKE,0:BAKE};
const evt=()=>EVT[dow()]||null;
const cprice=c=>{const e=evt();return e&&e.ids.includes(c.id)?Math.round(c.price*(1-e.pct)):c.price};

/* тап по предмету комнаты: питомец подходит и реагирует; раз в минуту на слот даёт чуть настроения и опыта навыка */
const VIS={
 bowl:{pose:['eat',1500],fl:'heart',mood:2},
 bed:{pose:['sleep',1900],fl:'zzz',mood:1},
 picture:{fl:'heart',mood:1,s:['bea',1]},
 clock:{fl:'sparkle',s:['int',.8]},
 shelf:{fl:'star',s:['int',1.5]},
 starlamp:{fl:'sparkle',mood:2},
 house:{pose:['sleep',1900],fl:'zzz',mood:1},
 post:{anim:'shake',fl:'bolt',s:['agi',1.5]},
 aqua:{anim:'jump',fl:'heart',mood:2,s:['int',.8]}
};
const visitAt={},skillAt={};
function visit(slot){
  const it=DEC.find(d=>d.id===S.placed[slot]),v=it&&VIS[it.id];
  if(!v||adOpen||!S.species||S.sleeping||S.walk)return;
  const w=$('#petWrap');
  w.style.setProperty('--dx',slot.endsWith('_l')?'-26%':'26%');w.classList.add('go');
  clearTimeout(visit.t);visit.t=setTimeout(()=>{w.classList.remove('go');w.style.setProperty('--dx','0%')},1700);
  if(v.pose)setPose(v.pose[0],v.pose[1]);
  if(v.anim)setTimeout(()=>anim(v.anim),450);
  setTimeout(()=>fl(v.fl),450);sfx.tap();
  const n=Date.now();
  if((visitAt[slot]||0)<n){
    visitAt[slot]=n+60000;
    if(v.mood)S.mood=cl(S.mood+v.mood);
    /* навык от предмета — раз в 10 минут на слот, иначе тапами он качается до максимума за полчаса */
    if(v.s&&(skillAt[slot]||0)<n){skillAt[slot]=n+600000;gain(v.s[0],v.s[1])}
    save();
  }
}

/* прогулки: питомец уходит на время (в реальных часах), возвращается с монетами и иногда с находкой */
const WK=[
 {id:'yard',min:20,c:[8,14],item:.05,ic:'flower',t:'t-mint',n:['Во двор','Backyard'],g:{agi:2}},
 {id:'park',min:60,c:[25,40],item:.2,ic:'sun',t:'t-butter',n:['В парк','To the park'],g:{agi:1,int:2}},
 {id:'trip',min:120,c:[60,90],item:.45,ic:'star',t:'t-lav',n:['В большой поход','Big trip'],g:{agi:2,int:3,bea:1}}
];
const walkMin=w=>Math.max(5,Math.round(w.min*(1-sk('int')*.03)));
function startWalk(id){
  const w=WK.find(x=>x.id===id);
  if(!w||S.walk||S.sleeping)return;
  if(S.energy<30||S.hunger<30){toast(L('Сначала накорми и дай отдохнуть','Feed and rest your pet first'));sfx.bad();return}
  const n=Date.now();S.walk={id,until:n+walkMin(w)*60000};
  hideOv();lastSig='';render(true);save(true);sfx.ok();toast(`${S.name} ${L('ушёл гулять','went for a walk')}`);
}
function walkTick(){
  if(!S.walk||Date.now()<S.walk.until||!ov.classList.contains('hidden')||G||adOpen||picking)return;
  finishWalk();
}
function finishWalk(){
  const w=WK.find(x=>x.id===S.walk.id)||WK[0];S.walk=null;
  const mult=boostOn()?2:1,coins=Math.round((w.c[0]+Math.random()*(w.c[1]-w.c[0]))*(1+sk('agi')*.03))*mult;
  const pool=[...DEC,...TH,...SK].filter(x=>!S.owned[x.id]&&avail(x)&&!isLocked(x));
  let found=null;
  if(pool.length&&Math.random()<w.item+sk('int')*.015){found=pool[Math.floor(Math.random()*pool.length)];grant(found)}
  S.coins+=coins;S.hunger=cl(S.hunger-15);S.energy=cl(S.energy-20);S.clean=cl(S.clean-20);S.mood=cl(S.mood+15);S.xp+=w.min/20;checkEvolve();
  for(const k in w.g)gain(k,w.g[k]);
  lastSig='';render(true);save(true);sfx.up();
  const fv=found?view(found):null;
  showOv(`<div class="card"><h2>${esc(S.name)} ${L('вернулся','is back')}</h2><div class="bigstar">${ic('coin')}<b>+${coins}</b>${mult>1?'<i class="x2">×2</i>':''}</div>
${fv?plainRow('disabled',fv.tile,fv.cls,fv.name,L('Нашёл на прогулке!','Found on the walk!'),'','static'):''}
<button class="btn go" id="gdbl">${ic('tv')}${t('double')}</button><button class="btn alt" id="gtake">${t('take')}</button></div>`);
  const done=()=>{hideOv();render(true);save(true)};
  $('#gdbl').onclick=()=>showRewarded(()=>{S.coins+=coins;fl('coin');done()});
  $('#gtake').onclick=done;
}

/* карточка питомца: навыки, вкусы, прогулки */
function openProfile(){
  if(adOpen||!S.species)return;
  ensureTaste();const T=S.taste;
  const cn=id=>CONS.find(c=>c.id===id);
  const taste=(k,known,id,heart)=>plainRow('disabled',known?ic(cn(id).icon()):'<b class="q">?</b>',heart?'t-pink':'t-sky',
    heart?L('Любимое','Favorite'):L('Не любит','Dislikes'),known?nm(cn(id)):L('Пока неизвестно','Not found out yet'),'','static');
  let h=`<div class="rprog"><b>${t('stage')[S.stage]} · ${t('sp')[S.species]}</b></div><div class="sh">${L('Навыки','Skills')}</div>`;
  for(const s of SKL){
    const v=S.skl[s.id]||0;
    h+=`<div class="row static"><span class="tile ${s.t}">${ic(s.ic)}</span><span class="nm">${nm(s)} · ${sk(s.id)}/10<div class="xp"><i style="width:${v}%"></i></div><small>${L(...s.d)}</small></span></div>`;
  }
  h+=`<div class="sh">${L('Характер','Character')}</div>${taste('l',T.kl,T.l,1)}${taste('h',T.kh,T.h,0)}<small class="hint">${L('Пробуй разное в магазине, чтобы узнать вкусы','Try things from the shop to learn tastes')}</small>`;
  h+=`<div class="sh">${L('Прогулка','Walk')}</div>`;
  if(S.walk){
    const w=WK.find(x=>x.id===S.walk.id)||WK[0];
    h+=plainRow('disabled',ic(w.ic),w.t,L('Гуляет','Out for a walk'),`${L('Вернётся через','Back in')} ${fmtT(S.walk.until-Date.now())}`,'','static');
    h+=plainRow('data-recall="1"',ic('refresh'),'t-sky',L('Позвать домой','Call home'),L('Без награды','No reward'),'');
  }else{
    for(const w of WK)h+=plainRow(`data-walk="${w.id}"`,ic(w.ic),w.t,nm(w),`${fmtMin(walkMin(w))} · ${w.c[0]}–${w.c[1]} ${L('монет','coins')}${w.item>=.2?' · '+L('находки','finds'):''}`,chip(L('Идти','Go'),'g'));
  }
  showOv(`<div class="card shop"><button class="x" data-close="1" aria-label="${t('close')}">${ic('x')}</button><h2>${esc(S.name)}</h2><div class="shbody">${h}</div></div>`);
  ov.onclick=e=>{
    if(e.target===ov){hideOv();return}
    const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.close){hideOv();return}
    if(d.walk){startWalk(d.walk);return}
    if(d.recall){S.walk=null;lastSig='';hideOv();render(true);save(true);toast(L('Вернулся без награды','Back with nothing'));return}
  };
}

/* ---------- несколько питомцев ---------- */

const snap=()=>{const o={};for(const k of PETF)o[k]=S[k];return o};

  if(it.k==='theme')return{tile:ic(it.ic),cls:it.t,name:nm(it),desc:L('Новый вид комнаты','A new look for the room')};

function bodyPets(){

    h+=plainRow(i?`data-pet="${i-1}"`:'data-pet0="1"',drawAny(p.species,p.coat,p.stage||1,'happy'),'t-sky',esc(p.name),`${t('stage')[p.stage||1]} · ${t('sp')[p.species]}`,i?chip(L('Выбрать','Switch')):chip(L('Сейчас','Now'),'g','check'));
  });
  if(used<S.slots)h+=plainRow('data-newpet="1"',ic('plus'),'t-mint',t('newPet'),L('Свободное место','A free spot'),chip(L('Выбрать','Pick')));
  else if(S.slots<3){const p=S.slots===1?250:450;h+=plainRow(`data-slot="${p}"`,ic('plus'),'t-butter',L('Ещё одно место','One more spot'),L('Второй или третий питомец','A second or third pet'),pricePill(p))}
  const sp=S.species,free=SP[sp].coats.map((c,i)=>coatFree(sp,i)?i:-1).filter(i=>i>=0);
  if(free.length>1)h+=`<div class="sh">${L('Окрас','Coat')}</div><div class="coats in">${free.map(i=>`<button class="coat ${i===S.coat?'on':''}" data-coat="${i}" aria-label="${i+1}" style="background:${SP[sp].coats[i].B}"></button>`).join('')}</div>`;
  const buy=coatItems(sp).filter(x=>!coatFree(sp,x.ci)&&avail(x));
  const skins=SK.filter(avail);
  if(buy.length)h+=`<div class="sh">${L('Окрас','Coat')}</div>`;
  for(const it of buy)h+=itemRow(it,it.price);
  if(skins.length)h+=`<div class="sh">${L('Образ','Outfit')}</div>`;
  for(const it of skins)h+=itemRow(it,it.price);
  h+=plainRow('data-reset="1"',ic('refresh'),'t-sky',L('Начать сначала','Start over'),'','','');
  return h;
}

function openShop(tab,hl,keep){
  if(adOpen||!S.species)return;
  if(tab)shopTab=tab;
  const sc=keep?((ov.querySelector('.shbody')||{}).scrollTop||0):0;
  const T=[['food',L('Еда','Food')+(evt()?'<b class="dot"></b>':'')],['room',L('Комната','Room')],['daily',L('Витрина','Daily')],['pets',L('Питомцы','Pets')]];
  const body={food:bodyFood,room:bodyRoom,daily:bodyDaily,pets:bodyPets}[shopTab]();
  showOv(`<div class="card shop"><button class="x" data-close="1" aria-label="${t('close')}">${ic('x')}</button><h2>${t('shop')}</h2>
<div class="chip cc">${ic('coin')}<b>${Math.floor(S.coins)}</b>${boostOn()?'<i class="x2">×2</i>':''}</div>
<div class="tabs">${T.map(x=>`<button data-tab="${x[0]}" class="${x[0]===shopTab?'on':''}">${x[1]}</button>`).join('')}</div>
<div class="shbody">${body}</div></div>`);
  const bd=ov.querySelector('.shbody');
  if(sc)bd.scrollTop=sc;
  else if(hl){const w=bd.querySelector('.row.wish');if(w)w.scrollIntoView({block:'center'})}
  ov.onclick=e=>{
    if(e.target===ov){hideOv();render(true);return}
    const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.close){hideOv();render(true);return}
    if(d.tab){openShop(d.tab);return}
    if(d.cons){const c=CONS.find(x=>x.id===d.cons);if(c&&pay(cprice(c))){c.use();fl(c.icon());sfx.ok();tasteReact(c.id);if(c.id==='toy')gain('int',2);if(c.id==='spa')gain('bea',3);shopAgain()}return}
    if(d.it){
      const it=findItem(d.it);if(!it)return;
      if(isLocked(it)){toast(L('Откроется на стадии','Unlocks at stage')+': '+t('stage')[it.st]);sfx.bad();return}
      if(S.owned[it.id])useOwned(it);else buyItem(it,+d.p);
      return;
    }
    if(d.theme0){S.theme='';shopAgain();return}
    if(d.coat!==undefined){S.coat=+d.coat;preloadSprites();shopAgain();return}
    if(d.pet!==undefined){switchPet(+d.pet);return}
    if(d.newpet){adding=true;hideOv();openPick();return}
    if(d.slot){if(pay(+d.slot)){S.slots++;sfx.ok();shopAgain()}return}
    if(d.ad==='coins'){showRewarded(()=>{S.coins+=25;sfx.ok();render();save(true);openShop(null,null,true)});return}
    if(d.ad==='boost'){showRewarded(()=>{S.boost=Date.now()+10*60000;sfx.ok();render(true);save(true);openShop(null,null,true)});return}
    if(d.ad==='free'){showRewarded(()=>{
      const sh=showcase(),c=sh.ids.map(findItem).find(x=>x&&!S.owned[x.id]&&!isLocked(x)&&avail(x));
      if(c){sh.free=1;grant(c);sfx.ok();toast(view(c).name);render(true);save(true)}
      openShop(null,null,true)});return}
    if(d.reset){
      if(!b.dataset.armed){b.dataset.armed='1';b.classList.add('armed');b.querySelector('.nm').textContent=t('sure');return}
      S=Object.assign(def(),{best:S.best,muted:S.muted});lastSig='';adding=false;
      buildUI();render(true);save(true);openPick();return;
    }
  };
}

/* ---------- мини-игра «Лови звёзды» ---------- */
let G=null;
function openGame(){
  showOv(`<div class="card game"><div class="ghud"><div class="chip">${ic('star')}<b id="gs">0</b></div><div class="gt"><i id="gtb"></i><b id="gt">20</b></div></div>
<div id="garea"><div id="gp">${petSVG()}</div><div id="ghint">${t('catchHint').replace('\n','<br>')}</div></div></div>`);
  gp('start');
  const area=$('#garea'),r=area.getBoundingClientRect();
  G={x:.5,score:0,time:20,items:[],spawn:0,last:performance.now(),run:true,W:r.width,H:r.height,area,pet:$('#gp'),care:care(),w:sk('agi')*2};
  G.pet.style.left='50%';
  const mv=e=>{const rr=area.getBoundingClientRect();G.x=Math.max(.08,Math.min(.92,(e.clientX-rr.left)/rr.width))};
  area.addEventListener('pointerdown',mv);area.addEventListener('pointermove',mv);
  G.key=e=>{if(e.key==='ArrowLeft')G.x=Math.max(.08,G.x-.07);if(e.key==='ArrowRight')G.x=Math.min(.92,G.x+.07)};
  window.addEventListener('keydown',G.key);
  setTimeout(()=>{const h=$('#ghint');if(h)h.style.opacity=0},2200);
  requestAnimationFrame(gloop);
}
function gloop(now){
  if(!G||!G.run)return;
  const dt=Math.min(.05,(now-G.last)/1000);G.last=now;
  if(!adOpen&&!document.hidden){
    G.time-=dt;G.spawn-=dt;
    if(G.spawn<=0){
      G.spawn=Math.max(.35,.8-.02*(20-G.time));
      const star=Math.random()<.75,el=document.createElement('div');
      el.className='git'+(star?' s':'');el.innerHTML=ic(star?'star':'rock');
      const x=.08+Math.random()*.84;el.style.left=(x*100)+'%';G.area.appendChild(el);
      G.items.push({el,x,y:-30,v:150+Math.random()*110+(20-G.time)*4,star});
    }
    for(let i=G.items.length-1;i>=0;i--){
      const it=G.items[i];it.y+=it.v*dt;it.el.style.transform=`translate(-50%,${it.y}px)`;
      if(it.y>G.H-80&&it.y<G.H-20&&Math.abs(it.x-G.x)*G.W<46+G.w){
        if(it.star){G.score++;sfx.tap()}else{G.score=Math.max(0,G.score-2);sfx.bad()}
        it.el.remove();G.items.splice(i,1);$('#gs').textContent=G.score;
      }else if(it.y>G.H){it.el.remove();G.items.splice(i,1)}
    }
    G.pet.style.left=(G.x*100)+'%';
    $('#gt').textContent=Math.max(0,Math.ceil(G.time));{const tb=$('#gtb');tb.style.width=Math.max(0,G.time/20*100)+'%';tb.classList.toggle('low',G.time<5)}
    if(G.time<=0){endGame();return}
  }
  requestAnimationFrame(gloop);
}
function endGame(){
  G.run=false;window.removeEventListener('keydown',G.key);gp('stop');
  const base=G.score,cr=G.care,mult=boostOn()?2:1,reward=Math.round(base*cr*(1+sk('agi')*.03))*mult;G=null;
  gain('agi',Math.min(8,base*.4));
  S.coins+=reward;S.mood=cl(S.mood+Math.min(40,base*3));S.energy=cl(S.energy-15);S.xp+=2;checkEvolve();
  if(base>S.best){
    S.best=base;
    // таблицу лидеров с именем "catch" нужно создать в консоли разработчика
    try{if(ysdk)ysdk.getLeaderboards().then(lb=>lb.setLeaderboardScore('catch',base)).catch(()=>{})}catch(e){}
  }
  save(true);sfx.up();
  showOv(`<div class="card"><h2>${t('result')}</h2><div class="bigstar">${ic('star')}<b>${base}</b></div>
<div class="rw"><span class="pp">+${reward} ${ic('coin')}${mult>1?'<i class="x2">×2</i>':''}</span><span>${t('best')}: ${S.best}</span></div>
${cr!==1?`<div class="rw care">${cr>1?L('Сытый и весёлый питомец','Fed and happy pet'):L('Голодный или грустный питомец','Hungry or sad pet')} ×${cr}</div>`:''}
${reward>0?`<button class="btn go" id="gdbl">${ic('tv')}${t('double')}</button>`:''}
<button class="btn alt" id="gtake">${t('take')}</button></div>`);
  const done=()=>{hideOv();render(true);save(true);maybeInterstitial()};
  const d=$('#gdbl');
  if(d)d.onclick=()=>showRewarded(()=>{S.coins+=reward;fl('coin');done()});
  $('#gtake').onclick=done;
}

/* ---------- запуск ---------- */
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});
window.addEventListener('pagehide',()=>save(true));
/* отладочные функции (в том числе читы на монеты и опыт) доступны только при локальном запуске и в тестах, в опубликованной игре их нет */
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))window.dbg={fxm,loop,step,act,startWalk,fmtMin,cprice,grant,roomBonus,findItem,sk,endGame,game:()=>G,DEC,setDay:n=>{dayOver=n},walkEnd:()=>{if(S.walk)S.walk.until=0},visit,gain,xp:n=>{S.xp+=n;checkEvolve();render(true)},coins:n=>{S.coins+=n;render()},state:()=>S,
  reset:()=>{S=def();save(true);setTimeout(()=>location.reload(),300)}};
(async()=>{
  await initSDK();await load();buildUI();preloadSprites();loop();render(true);
  setInterval(loop,1000);
  if(!S.species)openPick();
  try{ysdk&&ysdk.features.LoadingAPI.ready()}catch(e){}
})();
})();
</script>
